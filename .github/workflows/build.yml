name: Build Workflow
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publish:
    name: 'Build & Publish'
    runs-on: ubuntu-latest
    environment: build
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Install the pinned toolchain (node) the same way local dev does.
      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          install_args: '--locked' # honor mise.lock
          cache: false # one-shot release build; caching here is a poisoning vector (zizmor: cache-poisoning)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # so tool installs don't hit API rate limits
      # Install the workflow's runtime deps into src/ so they get vendored into the bundle.
      - name: Install deps
        run: mise run deps
      # Stamp the release tag into src/info.plist and zip src/ into the .alfredworkflow.
      - name: Create Alfred Workflow
        id: build
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mise run build --version "$VERSION"
          echo "artifactPath=${PWD}/build/alfred-jira-search-${VERSION}.alfredworkflow" >> "$GITHUB_OUTPUT"
      - name: Upload release asset
        uses: diamondburned/action-upload-release@7db8db63a78c06f926781e117394719b303ddfc7 # v0.0.1
        with:
          files: ${{ steps.build.outputs.artifactPath }}
